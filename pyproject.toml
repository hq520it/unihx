[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unihx"
version = "0.1.0"
description = "uni-app 跨平台构建/调试/发布工具：离线打包、自定义发行模式、不依赖 HBuilderX"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "hq520it", email = "hq520it+525141335@qq.com" }]
requires-python = ">=3.9"
keywords = ["uni-app", "hbuilderx", "wechat", "miniprogram", "cli", "cross-platform"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
json5 = ["json5>=1.0"]

[project.scripts]
unihx = "unihx.cli:main"
unihx-gui = "unihx.gui:main"

[project.urls]
Homepage = "https://github.com/hq520it/unihx"
Repository = "https://github.com/hq520it/unihx"
Changelog = "https://github.com/hq520it/unihx/releases"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
